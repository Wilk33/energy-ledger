name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Home Assistant app configuration
        uses: frenck/action-app-linter@v2
        with:
          path: "./energy-ledger"
      - name: Validate Battery Charge Controller configuration
        uses: frenck/action-app-linter@v2
        with:
          path: "./battery-charge-controller"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install runtime dependencies
        run: |
          python -m pip install -r energy-ledger/rootfs/requirements.txt
          python -m pip install -r battery-charge-controller/rootfs/requirements.txt
      - name: Verify generated runtime copy
        run: |
          python tools/sync_runtime.py
          git diff --exit-code
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q energy_ledger battery_charge_controller energy-ledger/rootfs/usr/src/app/energy_ledger battery-charge-controller/rootfs/usr/src/app/battery_charge_controller
