name: Energy Ledger
description: Magazyn wirtualny prosumenta i bieżący koszt energii TAURON G13
version: "1.0.0"
slug: energy-ledger
url: "https://github.com/Wilk33/energy-ledger"
stage: stable
startup: application
boot: auto
init: false
homeassistant_api: true
hassio_api: true
hassio_role: default
services:
  - mqtt:need
arch:
  - aarch64
  - amd64
options:
  grid_import_total_entity: null
  grid_export_total_entity: null
  discount_percent: 80
  balance_correction_kwh: 0.0
  history_days: 45
  tariff_update_enabled: true
  tariff_catalog_url: https://raw.githubusercontent.com/Wilk33/energy-ledger/main/energy-ledger/rootfs/usr/src/app/energy_ledger/data/tauron-g13.json
  additional_fixed_monthly: 29.58
  manual_prices_enabled: false
  manual_energy_morning_peak: 0.5803
  manual_energy_afternoon_peak: 0.9631
  manual_energy_other: 0.5240
  manual_distribution_morning_peak: 0.2710
  manual_distribution_afternoon_peak: 0.4795
  manual_distribution_other: 0.0482
  manual_common_variable: 0.0535
  manual_fixed_monthly: 48.55
  mqtt_base_topic: energy_ledger
  mqtt_discovery_prefix: homeassistant
  device_name: Energy Ledger
  log_level: INFO
schema:
  grid_import_total_entity: str
  grid_export_total_entity: str
  discount_percent: list(70|80)
  balance_correction_kwh: float
  history_days: int(1,730)
  tariff_update_enabled: bool
  tariff_catalog_url: url?
  additional_fixed_monthly: float(0,1000)
  manual_prices_enabled: bool
  manual_energy_morning_peak: float(0,100)
  manual_energy_afternoon_peak: float(0,100)
  manual_energy_other: float(0,100)
  manual_distribution_morning_peak: float(0,100)
  manual_distribution_afternoon_peak: float(0,100)
  manual_distribution_other: float(0,100)
  manual_common_variable: float(0,100)
  manual_fixed_monthly: float(0,10000)
  mqtt_base_topic: str
  mqtt_discovery_prefix: str
  device_name: str
  log_level: list(DEBUG|INFO|WARNING|ERROR)
