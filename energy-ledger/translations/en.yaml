configuration:
  monthly_bill_correction_pln: {name: Fixed monthly gross bill adjustment, description: Amount in PLN added once to each monthly total. Empty means zero. Negative values reduce the total. No extra VAT. Save and restart after changing.}
  grid_import_total_entity: {name: Total import entity, description: Increasing total grid import meter in kWh.}
  grid_export_total_entity: {name: Total export entity, description: Increasing total grid export meter in kWh.}
  discount_percent: {name: Net-metering discount, description: Export credited to virtual storage - 80% or 70%.}
  balance_correction_kwh: {name: One-time storage correction, description: Positive or negative kWh value. The app resets this option to zero after applying it.}
  history_days: {name: History limit, description: Maximum history days used while recovering state.}
  tariff_update_enabled: {name: Automatic tariff update, description: Downloads and validates the tariff catalog at startup.}
  tariff_catalog_url: {name: Tariff catalog URL, description: HTTPS URL of the versioned JSON catalog.}
  additional_fixed_monthly: {name: Additional fixed fees, description: Monthly capacity, commercial and other gross fees in PLN.}
  manual_prices_enabled: {name: Use manual prices, description: Replaces the complete automatic catalog with the values below.}
  manual_energy_morning_peak: {name: Energy - morning peak, description: Gross energy sale price in PLN/kWh.}
  manual_energy_afternoon_peak: {name: Energy - afternoon peak, description: Gross energy sale price in PLN/kWh.}
  manual_energy_other: {name: Energy - other hours, description: Gross energy sale price in PLN/kWh.}
  manual_distribution_morning_peak: {name: Distribution - morning peak, description: Gross variable distribution price in PLN/kWh.}
  manual_distribution_afternoon_peak: {name: Distribution - afternoon peak, description: Gross variable distribution price in PLN/kWh.}
  manual_distribution_other: {name: Distribution - other hours, description: Gross variable distribution price in PLN/kWh.}
  manual_common_variable: {name: Combined variable fees, description: Gross sum of quality, RES and cogeneration fees in PLN/kWh. RES and cogeneration fields separate the parts charged on total import.}
  manual_oze_variable: {name: RES fee, description: Gross PLN/kWh rate applied to all energy imported from the grid.}
  manual_cogeneration_variable: {name: Cogeneration fee, description: Gross PLN/kWh rate applied to all energy imported from the grid.}
  manual_fixed_monthly: {name: All manual fixed fees, description: Complete monthly gross fixed fee total in PLN for manual mode.}
  manual_vat_percent: {name: VAT, description: VAT percentage used to calculate separate net and gross values.}
  mqtt_base_topic: {name: MQTT base topic, description: State and availability topic prefix.}
  mqtt_discovery_prefix: {name: MQTT Discovery prefix, description: Usually homeassistant.}
  device_name: {name: Device name, description: Device name shown in Home Assistant.}
  log_level: {name: Log level, description: Application log verbosity.}
